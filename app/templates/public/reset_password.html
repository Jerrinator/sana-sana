{% extends 'base.html' %}
{% block content %}
<section class="container section narrow" style="max-width: 32rem; margin: 0 auto;">
  <div class="card card-arched" style="padding: 2.2rem; border-radius: 36px !important; text-align: center;">
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--sana-forest);">Set New Password</h1>
    <p class="muted" style="margin-bottom: 1.5rem;">Enter and confirm your new password for <strong>{{ customer.get('name', 'Member') }}</strong> ({{ customer.get('email', '') }}).</p>

    <form action="{{ url_for('auth.customer_reset_password') }}" method="post" class="stacked-form" style="padding: 0;">
      <input type="hidden" name="token" value="{{ token }}" />
      <input type="password" name="new_password" placeholder="New Password" required style="font-size: 1rem;" />
      <input type="password" name="confirm_password" placeholder="Confirm New Password" required style="font-size: 1rem;" />
      <button type="submit" class="btn" style="width: 100%; margin-top: 0.8rem;">Update Password</button>
    </form>
  </div>
</section>
{% endblock %}

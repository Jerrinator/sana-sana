{% extends 'base.html' %}
{% block content %}
<section class="container section narrow">
  <h1>Change Admin Password</h1>
  <p class="lead">Your account is using a temporary password. Create a new password before continuing.</p>
  <form class="stacked-form" method="post">
    <input type="password" name="current_password" placeholder="Current password" required />
    <input type="password" name="new_password" placeholder="New password" required />
    <input type="password" name="confirm_password" placeholder="Confirm new password" required />
    <button class="btn" type="submit">Update Password</button>
  </form>
  <p class="muted">After you update the password, you’ll be sent to the dashboard automatically.</p>
</section>
{% endblock %}
